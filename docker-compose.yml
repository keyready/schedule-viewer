services:
  mongo:
    image: ${MONGO_IMAGE:-mongo:7}
    container_name: schedule-mongo
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  mongo-init:
    image: mongo:7
    container_name: schedule-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./server/backup/dump:/dump
      - mongo_data:/data/db
    command: >
      bash -c "
        echo 'Waiting for MongoDB...' &&
        until mongosh --host mongo:27017 --eval \"db.adminCommand('ping')\" > /dev/null 2>&1; do
          sleep 5;
          echo '... waiting for MongoDB ...';
        done;
        echo 'MongoDB ready. Starting restore...';
        if [ -d /dump/schedule-viewer ]; then
          mongorestore --host mongo:27017 --db schedule-viewer /dump/schedule-viewer;
          echo 'Restore done.';
        else
          echo 'Backup not found: /dump/schedule-viewer. Skipping restore.';
        fi;
        echo 'mongo-init finished.';
      "
    restart: "no"

  server:
    build:
      context: ./server
    container_name: schedule-server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=${SERVER_PORT:-5000}
      - MONGODB_URI=mongodb://mongo:27017/schedule-viewer
      - FILES_DIR=/app/files/
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    volumes:
      - ./server/files:/app/files:ro
    ports:
      - "${SERVER_PORT:-5000}:5000"

  client:
    build:
      context: ./client
    container_name: schedule-client
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # leave NEXT_PUBLIC_API_URL unset to use relative requests in browser
    depends_on:
      server:
        condition: service_started
    ports:
      - "${CLIENT_PORT:-3000}:3000"

volumes:
  mongo_data:

networks:
  default:
    name: schedule-network

