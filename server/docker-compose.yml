services:
  mongo:
    image: mongo:latest
    container_name: schedule-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  server:
    build:
      context: .
    container_name: schedule-server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/schedule-viewer
      - FILES_DIR=/server/files/
    depends_on:
      - mongo
    volumes:
      - ./files:/server/files:ro
    expose:
      - "5000"
    ports:
      - "5000:5000"

volumes:
  mongo_data:
