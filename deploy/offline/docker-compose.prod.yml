services:
  mongo:
    image: mongo:7
    container_name: schedule-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  mongo-init:
    image: mongo:7
    container_name: schedule-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ../../server/backup/dump:/dump:ro
      - mongo_data:/data/db
    command: >
      bash -c "
        echo 'Waiting for MongoDB...' &&
        until mongosh --host mongo:27017 --eval \"db.adminCommand('ping')\" > /dev/null 2>&1; do
          sleep 5;
          echo '... waiting for MongoDB ...';
        done;
        echo 'MongoDB ready. Starting restore...';
        if [ -d /dump/schedule-viewer ]; then
          mongorestore --host mongo:27017 --db schedule-viewer /dump/schedule-viewer;
          echo 'Restore done.';
        else
          echo 'Backup not found: /dump/schedule-viewer. Skipping restore.';
        fi;
        echo 'mongo-init finished.';
      "
    restart: "no"

  server:
    image: schedule-viewer-server:prod
    container_name: schedule-server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=6000
      - MONGODB_URI=mongodb://mongo:27017/schedule-viewer
      - FILES_DIR=/app/files/
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    # For fully self-contained image, do NOT mount files.
    # To override schedule files from host, uncomment the volume below:
    # volumes:
    #   - ../../server/files:/app/files:ro
    ports:
      - "6000:6000"

  client:
    image: schedule-viewer-client:prod
    container_name: schedule-client
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      server:
        condition: service_started
    ports:
      - "2000:2000"

volumes:
  mongo_data:

networks:
  default:
    name: schedule-network

